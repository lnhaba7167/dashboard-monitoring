<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard Monitoring — lnhaba7167</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <h1>Dashboard Monitoring</h1>
    <p>Demo: metrik di-generate secara acak. Halaman ini akan diterbitkan ke GitHub Pages.</p>
  </header>

  <main class="grid">
    <section class="card">
      <h2>CPU Usage (%)</h2>
      <canvas id="cpuChart"></canvas>
    </section>

    <section class="card">
      <h2>Memory Usage (MB)</h2>
      <canvas id="memChart"></canvas>
    </section>

    <section class="card wide">
      <h2>Requests per Minute</h2>
      <canvas id="reqChart"></canvas>
    </section>
  </main>

  <footer>
    <small>Di-deploy otomatis oleh GitHub Actions ke branch gh-pages.</small>
  </footer>

  <script src="/assets/script.js"></script>
</body>
</html>
